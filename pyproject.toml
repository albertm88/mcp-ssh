[project]
name = "mcp-ssh"
version = "1.0.0"
description = "Lightweight cross-platform SSH MCP server; reuses local ~/.ssh/config, supports key + password auth, file transfer, and network scanning"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "mcp>=1.2.0,<2.0",
    "paramiko>=3.4.0",
    "charset-normalizer>=3.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "server",
    "review",
    "logger",
    "host_keys",
    "results",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
