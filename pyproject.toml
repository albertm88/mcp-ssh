[project]
name = "mcp-ssh"
version = "1.0.1"
description = "Cross-platform SSH MCP server; reuses local ~/.ssh/config, supports key + password auth, file transfer, and network scanning"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "mcp>=1.2.0,<2.0",
    "paramiko>=3.4.0",
    "charset-normalizer>=3.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "server",
    "review",
    "logger",
    "host_keys",
    "results",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.ruff.lint]
# BLE001: 工具边界兜底捕获（防止未捕获异常导致 MCP 进程崩溃）是刻意设计，
# 各工具 handler 内已用精确异常映射（TimeoutError/AuthenticationException/OSError 等）。
ignore = ["BLE001"]
