# mcp-ssh 白名单规则配置
# 每行一个正则表达式，匹配成功的命令将被允许执行
# 以 # 开头的行为注释，空行忽略
#
# 环境变量 SSH_REVIEW_WHITELIST_FILE 可指定其他路径
# 默认路径: ~/.ssh/mcp-ssh-whitelist.conf

# ========== 文件查看 ==========
^ls\b
^ll\b
^pwd$
^cat\s+[^|;&]+$
^head\s+[^|;&]+$
^tail\s+[^|;&]+$
^less\s+[^|;&]+$
^more\s+[^|;&]+$
^wc\s+[^|;&]+$
^file\s+[^|;&]+$
^stat\s+[^|;&]+$

# ========== 系统信息 ==========
^whoami$
^hostname$
^uname\b
^df\b
^du\s+[^|;&]+$
^free\b
^uptime$
^date$
^timedatectl\b
^lsblk\b
^lscpu$
^lsmem\b
^lspci\b
^lsusb\b

# ========== 进程管理 ==========
^ps\b
^top\s+-b
^htop\s+-b
^pgrep\s+[^|;&]+$
^pidof\s+[^|;&]+$

# ========== 网络诊断 ==========
^ping\s+[^|;&]+$
^traceroute\s+[^|;&]+$
^mtr\s+[^|;&]+$
^netstat\s+[^|;&]*$
^ss\s+[^|;&]*$
^ip\s+(addr|link|route|neigh)\b
^ifconfig\b
^iwconfig\b
^curl\s+-I\s+[^|;&]+$
^wget\s+--spider\s+[^|;&]+$
^dig\s+[^|;&]+$
^nslookup\s+[^|;&]+$
^host\s+[^|;&]+$

# ========== 文件搜索 ==========
^find\s+[^|;&]+$
^grep\s+[^|;&]+$
^egrep\s+[^|;&]+$
^fgrep\s+[^|;&]+$
^locate\s+[^|;&]+$
^which\s+[^|;&]+$
^whereis\s+[^|;&]+$
^type\s+[^|;&]+$

# ========== 文件操作（低风险） ==========
^echo\s+[^|;&]*$
^touch\s+[^|;&]+$
^mkdir\s+[^|;&]+$
^rmdir\s+[^|;&]+$
^cp\s+[^|;&]+$
^mv\s+[^|;&]+$
^scp\s+[^|;&]+$
^rsync\s+[^|;&]+$
^ln\s+-s\s+[^|;&]+$
^readlink\s+[^|;&]+$
^basename\s+[^|;&]+$
^dirname\s+[^|;&]+$
^realpath\s+[^|;&]+$

# ========== 权限管理 ==========
^chmod\s+[0-7]{3,4}\s+[^|;&]+$
^chown\s+[^|;&]+$
^chgrp\s+[^|;&]+$

# ========== 压缩解压 ==========
^tar\s+[^|;&]+$
^gzip\s+[^|;&]+$
^gunzip\s+[^|;&]+$
^zip\s+[^|;&]+$
^unzip\s+[^|;&]+$
^7z\s+[^|;&]+$

# ========== Git 版本控制 ==========
^git\s+(status|log|diff|show|branch|tag|remote|stash|config)\b
^git\s+(checkout|switch|restore)\s+[^|;&]+$
^git\s+(pull|fetch|clone|push)\s+[^|;&]*$
^git\s+(add|commit|reset|revert|merge|rebase)\s+[^|;&]*$

# ========== Docker 容器 ==========
^docker\s+ps\b
^docker\s+images\b
^docker\s+logs\s+[^|;&]+$
^docker\s+inspect\s+[^|;&]+$
^docker\s+stats\s+[^|;&]*$
^docker\s+exec\s+[^|;&]+$
^docker\s+(start|stop|restart)\s+[^|;&]+$
^docker-compose\s+(ps|logs|up|down|restart)\b

# ========== Systemd 服务 ==========
^systemctl\s+(status|list-units|list-unit-files|is-active|is-enabled)\b
^systemctl\s+(start|stop|restart|reload|enable|disable)\s+[^|;&]+$
^journalctl\s+[^|;&]+$

# ========== 包管理（查询） ==========
^apt\s+(list|search|show)\b
^apt-cache\s+(search|show|policy)\b
^dpkg\s+-(l|s|L)\b
^yum\s+(list|search|info)\b
^dnf\s+(list|search|info)\b
^pip\s+(list|show|freeze)\b
^pip3\s+(list|show|freeze)\b
^npm\s+(list|ls|view|info)\b
^node\s+--version$
^python\s+--version$
^python3\s+--version$

# ========== 开发工具 ==========
^make\s+[^|;&]*$
^cmake\s+[^|;&]+$
^gcc\s+--version$
^g\+\+\s+--version$
^java\s+-version$
^go\s+version$
^rustc\s+--version$
^cargo\s+--version$

# ========== 其他常用 ==========
^history\b
^alias\b
^env\b
^printenv\b
^export\s+[^|;&]+$
^source\s+[^|;&]+$
^cd\s+[^|;&]*$
^exit$
^logout$
^clear$
^reset$
^tput\s+[^|;&]+$
^stty\s+[^|;&]+$
^tty$
^id$
^groups\b
^who\b
^w\b
^last\b
^lastlog\b
^finger\s+[^|;&]*$
