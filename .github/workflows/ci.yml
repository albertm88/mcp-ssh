name: CI

# 平台矩阵（1.0.0 声明）：仅支持 Windows + Linux（含 WSL2）。
# macOS 为不支持平台，故不纳入 CI 矩阵。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Compile tracked Python files
        run: >-
          python -c "import py_compile, subprocess;
          files = subprocess.check_output(['git', 'ls-files', '*.py'], text=True).splitlines();
          [py_compile.compile(path, doraise=True) for path in files];
          print(f'compiled {len(files)} tracked Python files')"

      - name: Run pytest
        if: ${{ hashFiles('tests/**/test_*.py', 'tests/**/*_test.py') != '' }}
        run: uv run --locked --with pytest==8.4.2 python -m pytest -q

      - name: Record missing pytest suite
        if: ${{ hashFiles('tests/**/test_*.py', 'tests/**/*_test.py') == '' }}
        run: echo "::notice::No pytest suite exists yet; this is compatible with CI but blocks a 1.0.0 release."

      - name: Run repository MCP contract tests
        if: ${{ hashFiles('tests/test_mcp_contract.py') != '' }}
        run: uv run --locked --with pytest==8.4.2 python -m pytest -q tests/test_mcp_contract.py

      - name: Run MCP tools/list contract smoke
        if: ${{ hashFiles('tests/test_mcp_contract.py') == '' }}
        shell: pwsh
        run: |
          @'
          import asyncio
          import sys

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client


          async def main() -> None:
              server = StdioServerParameters(command=sys.executable, args=["server.py"])
              async with stdio_client(server) as (read, write):
                  async with ClientSession(read, write) as session:
                      await session.initialize()
                      response = await session.list_tools()

              names = [tool.name for tool in response.tools]
              assert names, "tools/list returned no tools"
              assert len(names) == len(set(names)), "tools/list returned duplicate names"
              assert all(tool.inputSchema.get("type") == "object" for tool in response.tools)
              print(f"MCP contract smoke passed with {len(names)} tools")


          asyncio.run(main())
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/mcp_contract_smoke.py"
          uv run --locked python "$env:RUNNER_TEMP/mcp_contract_smoke.py"
