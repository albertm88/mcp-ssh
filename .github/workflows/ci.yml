name: CI

on:
  push:
    branches: [fast, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Cross-compile Windows
        run: GOOS=windows GOARCH=amd64 go build -o ssh-mcp-windows-amd64.exe ./cmd/ssh-mcp

      - name: Cross-compile Linux
        run: GOOS=linux GOARCH=amd64 go build -o ssh-mcp-linux-amd64 ./cmd/ssh-mcp

      - name: Cross-compile ARM64
        run: GOOS=linux GOARCH=arm64 go build -o ssh-mcp-linux-arm64 ./cmd/ssh-mcp
